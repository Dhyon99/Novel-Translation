<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Perpustakaan Novel</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: #f4f4f4;
            color: #333;
            font-family: Arial, sans-serif;
        }

        /* HEADER */
        header {
            background: #222;
            color: white;
            padding: 30px 20px;
        }

        .header-content {
            max-width: 1000px;
            margin: auto;
        }

        header h1 {
            margin: 0;
            font-size: 28px;
        }

        header p {
            margin: 8px 0 0;
            color: #ccc;
        }

        /* NAVIGASI */
        nav {
            background: #333;
        }

        .nav-content {
            max-width: 1000px;
            margin: auto;
            display: flex;
        }

        nav a {
            color: white;
            text-decoration: none;
            padding: 14px 20px;
            display: block;
        }

        nav a:hover {
            background: #444;
        }

        /* KONTEN */
        .container {
            max-width: 1000px;
            margin: auto;
            padding: 25px 20px;
        }

        /* PENCARIAN */
        .search {
            width: 100%;
            padding: 14px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 15px;
            margin-bottom: 25px;
        }

        /* JUDUL BAGIAN */
        .section-title {
            margin-bottom: 15px;
        }

        .section-title h2 {
            margin: 0;
        }

        /* KARTU NOVEL */
        .novel-list {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
        }

        .novel {
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }

        .novel h3 {
            margin-top: 0;
            margin-bottom: 8px;
        }

        .novel p {
            color: #666;
            line-height: 1.5;
        }

        .novel a {
            display: inline-block;
            margin-top: 8px;
            padding: 9px 14px;
            background: #222;
            color: white;
            text-decoration: none;
            border-radius: 6px;
        }

        .novel a:hover {
            background: #444;
        }

        /* FOOTER */
        footer {
            margin-top: 40px;
            background: #222;
            color: #aaa;
            text-align: center;
            padding: 20px;
        }

        /* UNTUK HP */
        @media (max-width: 600px) {

            header h1 {
                font-size: 24px;
            }

            .nav-content {
                flex-direction: column;
            }

            nav a {
                padding: 12px 20px;
            }

            .novel-list {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

<header>
    <div class="header-content">
        <h1>📚 Perpustakaan Novel</h1>
        <p>Kumpulan novel untuk dibaca kapan saja</p>
    </div>
</header>

<nav>
    <div class="nav-content">
        <a href="index.html">Beranda</a>
    </div>
</nav>

<div class="container">

    <input
        type="text"
        class="search"
        placeholder="🔎 Cari novel..."
    >

    <div class="section-title">
        <h2>Novel Terbaru</h2>
    </div>

    <div class="novel-list">

        <div class="novel">
            <h3>Judul Novel Pertama</h3>

            <p>
                Sebuah novel tentang perjalanan,
                pertemuan, dan rahasia yang tersembunyi.
            </p>

            <a href="novel1.html">
                Baca Novel →
            </a>
        </div>

        <div class="novel">
            <h3>Judul Novel Kedua</h3>

            <p>
                Deskripsi singkat untuk novel kedua.
            </p>

            <a href="#">
                Baca Novel →
            </a>
        </div>

    </div>

</div>

<footer>
    <p>© 2026 Perpustakaan Novel</p>
</footer>

</body>
</html>
